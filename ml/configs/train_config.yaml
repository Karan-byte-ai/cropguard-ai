model:
  name: "efficientnet_b0"
  pretrained: true
  num_classes: 38
  input_size: [3, 224, 224]

data:
  dataset: "PlantVillage"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  split_by_plant: true

training:
  batch_size: 64
  epochs: 30
  stage_1_epochs: 5  # head only
  stage_2_epochs: 25 # full fine-tuning
  learning_rate: 0.0003
  min_lr: 0.000001
  weight_decay: 0.0001
  label_smoothing: 0.1
  temperature_scaling: true

export:
  opset_version: 17
  output_path: "apps/inference/models/cropguard_efficientnet_b0_v1.onnx"
  quantization: "fp16"
