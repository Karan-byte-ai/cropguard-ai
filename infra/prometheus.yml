global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cropguard-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'cropguard-inference'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['inference:8001']
