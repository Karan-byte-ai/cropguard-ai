name: CropGuard AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cropguard
          POSTGRES_PASSWORD: cropguard_secret_pwd
          POSTGRES_DB: cropguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov bandit
          pip install -r apps/api/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check apps/api apps/inference apps/worker ml

      - name: Run Security Audit (Bandit)
        run: |
          bandit -r apps/api apps/inference -ll -ii

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://cropguard:cropguard_secret_pwd@localhost:5432/cropguard
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://cropguard:cropguard_secret_pwd@localhost:5432/cropguard
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-32-chars-long-minimum-secure
          ENVIRONMENT: test
        run: |
          cd apps/api
          pytest tests/ -v --cov=app

  frontend-lint-test:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Build Next.js App
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
